[package]
name = "terminus"
version = "3.8.0"
edition = "2021"
description = "CLI tool for HTTP endpoint testing with HTTP/2 desync detection, security analysis, passive vulnerability detection, smart diffing, multi-threading, and enhanced reporting."
license = "GPL-3.0"
authors = ["Gilles Biagomba<gilles.infosec@gmail.com>"]
repository = "https://github.com/gbiagomba/terminus"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "http2", "http3", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
async-trait = "0.1"
url = "2"
http = "1"
sha2 = "0.11"
hex = "0.4"
rig-core = "0.34"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.40", features = ["serialize"] }
regex = "1.13"
rand = "0.10"
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = "0.4"
ratatui = "0.30"
crossterm = "0.29"

[build-dependencies]
